<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator & 3D CalcES Phone</title>
    
    <!-- Load Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #ffffff; 
            color: #333; 
            padding: 20px; 
            max-width: 1200px; 
            margin: auto; 
        }

        .main-container { 
            display: flex; 
            gap: 40px; 
            flex-wrap: wrap; 
            align-items: center; 
            justify-content: center; 
        }

        /* GPA Card Styling */
        .card { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            border: 1px solid #e1e4e8;
            flex: 1; 
            min-width: 300px; 
            max-width: 400px; 
        }

        .card h2 { margin-top: 0; color: #111; }
        label { font-weight: bold; font-size: 0.85rem; color: #444; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin: 8px 0 15px 0; 
            background: #f9fafb; 
            border: 1px solid #d1d5db; 
            color: #333; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        button { 
            background: #0066cc; 
            color: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 5px; 
        }
        button:hover { background: #0052a3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #b02a37; }

        #result { 
            margin-top: 20px; 
            font-size: 1.2rem; 
            text-align: center; 
            color: #198754; 
            font-weight: bold; 
        }

        .course-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #f1f3f5; 
            padding: 8px 12px; 
            margin-top: 6px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            border: 1px solid #e9ecef;
        }

        /* --- 3D VIEWPORT --- */
        .calculator-3d-wrapper {
            position: relative;
            width: 400px;
            height: 700px;
            background: transparent;
            flex-shrink: 0;
        }

        #webgl-container { 
            width: 100%; 
            height: 100%; 
            display: block;
            cursor: grab; 
        }
        #webgl-container:active { cursor: grabbing; }

        .instruction-badge {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #0066cc;
            font-weight: bold;
            pointer-events: none;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- LEFT: GPA Calculator Card -->
        <div class="card">
            <h2>GPA Calculator</h2>
            <p style="color: #666; font-size: 0.9rem;">Calculate your semester grade point average easily.</p>
            
            <label>Course Name / Code</label>
            <input type="text" id="courseName" placeholder="e.g. Computer Architecture">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button onclick="addCourse()">Add Course</button>
            <button class="btn-danger" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #444;"></div>
            <div id="result"></div>
        </div>

        <!-- RIGHT: Free-Floating 3D Viewport -->
        <div class="calculator-3d-wrapper">
            <div id="webgl-container"></div>
            <div class="instruction-badge">🖱️ Drag to Rotate 360° (See Front & Back)</div>
        </div>

    </div>

    <script>
        // --- GPA CALCULATOR LOGIC ---
        let totalPoints = 0;
        let totalCredits = 0;

        function addCourse() {
            const name = document.getElementById('courseName').value || "Course";
            const points = parseFloat(document.getElementById('gradePoints').value);
            const credits = parseFloat(document.getElementById('credits').value);

            if (isNaN(credits) || credits <= 0) {
                alert("Please enter valid credit hours.");
                return;
            }

            totalPoints += (points * credits);
            totalCredits += credits;

            const gpa = (totalPoints / totalCredits).toFixed(2);
            
            document.getElementById('courseList').innerHTML += `<div class="course-row"><span>✔️ ${name} (${credits} Credits)</span><span>Pts: ${points}</span></div>`;
            document.getElementById('result').innerHTML = `Current Semester GPA: ${gpa}`;
            document.getElementById('courseName').value = '';
        }

        function resetGPA() {
            totalPoints = 0;
            totalCredits = 0;
            document.getElementById('courseList').innerHTML = '';
            document.getElementById('result').innerHTML = '';
        }

        // --- CALCES CALCULATOR INTERACTIVE ENGINE ---
        let expression = "4÷100";
        let resultOutput = "1\n25"; 

        const calcButtons = [
            { label: '☰', x: 20, y: 145, w: 42, h: 36, bg: '#2b263b', col: '#fff' },
            { label: 'PRO', x: 68, y: 145, w: 65, h: 36, bg: '#36234d', col: '#b87cf6' },
            { label: 'Σ', x: 139, y: 145, w: 42, h: 36, bg: '#2b263b', col: '#fff' },
            { label: '⚙', x: 187, y: 145, w: 42, h: 36, bg: '#2b263b', col: '#fff' },
            { label: '∡', x: 235, y: 145, w: 42, h: 36, bg: '#2b263b', col: '#fff' },
            { label: 'DEG', x: 283, y: 145, w: 55, h: 36, bg: '#2b263b', col: '#bbb' },
            { label: 'MORE', x: 344, y: 145, w: 65, h: 36, bg: '#2b263b', col: '#bbb' },
            { label: '📷', x: 415, y: 145, w: 75, h: 36, bg: '#2b263b', col: '#bbb' },

            { label: 'SHIFT', val: 'SHIFT', x: 20, y: 190, w: 72, h: 42, bg: '#f1a80a', col: '#000' },
            { label: 'ALPHA', val: 'ALPHA', x: 97, y: 190, w: 72, h: 42, bg: '#8a4fb5', col: '#fff' },
            { label: '◀', val: 'LEFT', x: 175, y: 190, w: 48, h: 42, bg: '#2b2836', col: '#fff' },
            { label: '▶', val: 'RIGHT', x: 228, y: 190, w: 48, h: 42, bg: '#2b2836', col: '#fff' },
            { label: 'MODE', val: 'MODE', x: 282, y: 190, w: 65, h: 42, bg: '#2b2836', col: '#fff' },
            { label: '2nd', val: '2nd', x: 353, y: 190, w: 137, h: 42, bg: '#2b2836', col: '#b87cf6' },

            { label: 'CALC', val: 'CALC', x: 20, y: 238, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: '∫dx', val: 'INT', x: 97, y: 238, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: '▲', val: 'UP', x: 175, y: 238, w: 48, h: 42, bg: '#2b2836', col: '#fff' },
            { label: '▼', val: 'DOWN', x: 228, y: 238, w: 48, h: 42, bg: '#2b2836', col: '#fff' },
            { label: 'x⁻¹', val: '**-1', x: 282, y: 238, w: 102, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: 'Log_y', val: 'LOGY', x: 388, y: 238, w: 102, h: 42, bg: '#2b2836', col: '#b87cf6' },

            { label: 'x/y', val: '/', x: 20, y: 286, w: 72, h: 42, bg: '#2b2836', col: '#b87cf6' },
            { label: '√x', val: 'Math.sqrt(', x: 97, y: 286, w: 72, h: 42, bg: '#2b2836', col: '#b87cf6' },
            { label: 'x²', val: '**2', x: 175, y: 286, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: 'x^y', val: '**', x: 252, y: 286, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: 'Log', val: 'Math.log10(', x: 330, y: 286, w: 78, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: 'Ln', val: 'Math.log(', x: 412, y: 286, w: 78, h: 42, bg: '#2b2836', col: '#bbb' },

            { label: '(-)', val: '-', x: 20, y: 334, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: '°\'"', val: '', x: 97, y: 334, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: 'hyp', val: '', x: 175, y: 334, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: 'Sin', val: 'Math.sin(', x: 252, y: 334, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: 'Cos', val: 'Math.cos(', x: 330, y: 334, w: 78, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: 'Tan', val: 'Math.tan(', x: 412, y: 334, w: 78, h: 42, bg: '#2b2836', col: '#bbb' },

            { label: 'RCL', val: 'RCL', x: 20, y: 382, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: 'ENG', val: 'ENG', x: 97, y: 382, w: 72, h: 42, bg: '#2b2836', col: '#bbb' },
            { label: '(', val: '(', x: 175, y: 382, w: 72, h: 42, bg: '#2b2836', col: '#fff' },
            { label: ')', val: ')', x: 252, y: 382, w: 72, h: 42, bg: '#2b2836', col: '#fff' },
            { label: 'S⇄D', val: 'SD', x: 330, y: 382, w: 78, h: 42, bg: '#2b2836', col: '#b87cf6' },
            { label: 'M+', val: 'M+', x: 412, y: 382, w: 78, h: 42, bg: '#2b2836', col: '#bbb' },

            { label: '7', val: '7', x: 20, y: 430, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '8', val: '8', x: 97, y: 430, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '9', val: '9', x: 175, y: 430, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '⌫', val: 'DEL', x: 252, y: 430, w: 110, h: 48, bg: '#d35400', col: '#fff' },
            { label: 'AC', val: 'AC', x: 366, y: 430, w: 124, h: 48, bg: '#e67e22', col: '#fff' },

            { label: '4', val: '4', x: 20, y: 484, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '5', val: '5', x: 97, y: 484, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '6', val: '6', x: 175, y: 484, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '×', val: '*', x: 252, y: 484, w: 110, h: 48, bg: '#2b2836', col: '#fff' },
            { label: '÷', val: '/', x: 366, y: 484, w: 124, h: 48, bg: '#2b2836', col: '#fff' },

            { label: '1', val: '1', x: 20, y: 538, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '2', val: '2', x: 97, y: 538, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '3', val: '3', x: 175, y: 538, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '+', val: '+', x: 252, y: 538, w: 110, h: 48, bg: '#2b2836', col: '#fff' },
            { label: '-', val: '-', x: 366, y: 538, w: 124, h: 48, bg: '#2b2836', col: '#fff' },

            { label: '0', val: '0', x: 20, y: 592, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: '.', val: '.', x: 97, y: 592, w: 72, h: 48, bg: '#23202b', col: '#fff' },
            { label: 'Exp', val: 'e', x: 175, y: 592, w: 72, h: 48, bg: '#2b2836', col: '#bbb' },
            { label: 'Ans', val: 'Ans', x: 252, y: 592, w: 110, h: 48, bg: '#2b2836', col: '#bbb' },
            { label: '=', val: '=', x: 366, y: 592, w: 124, h: 48, bg: '#2b2836', col: '#fff' }
        ];

        const phoneCanvas = document.createElement('canvas');
        phoneCanvas.width = 512;
        phoneCanvas.height = 660;
        const pCtx = phoneCanvas.getContext('2d');
        const phoneTexture = new THREE.CanvasTexture(phoneCanvas);
        phoneTexture.generateMipmaps = true;
        phoneTexture.minFilter = THREE.LinearMipmapLinearFilter;

        function redrawPhoneUI() {
            pCtx.fillStyle = '#17141f';
            pCtx.fillRect(0, 0, phoneCanvas.width, phoneCanvas.height);

            pCtx.fillStyle = '#9c95af';
            pCtx.font = 'bold 13px sans-serif';
            pCtx.fillText("NORM   MATH   FRAC", 20, 20);

            pCtx.fillStyle = '#d2e0df';
            pCtx.fillRect(15, 28, 482, 105);
            pCtx.strokeStyle = '#9bb1af';
            pCtx.lineWidth = 2;
            pCtx.strokeRect(15, 28, 482, 105);

            pCtx.fillStyle = '#1a1a1a';
            pCtx.font = 'bold 26px monospace';
            pCtx.fillText(expression, 28, 65);

            pCtx.font = 'bold 30px monospace';
            pCtx.textAlign = 'right';
            if (resultOutput.includes('\n')) {
                let lines = resultOutput.split('\n');
                pCtx.fillText(lines[0], 480, 85);
                pCtx.fillText(lines[1], 480, 120);
                pCtx.strokeStyle = '#1a1a1a';
                pCtx.lineWidth = 2;
                pCtx.beginPath();
                pCtx.moveTo(430, 95);
                pCtx.lineTo(485, 95);
                pCtx.stroke();
            } else {
                pCtx.fillText(resultOutput, 480, 105);
            }
            pCtx.textAlign = 'left';

            calcButtons.forEach(btn => {
                pCtx.fillStyle = btn.bg;
                pCtx.fillRect(btn.x, btn.y, btn.w, btn.h);
                pCtx.strokeStyle = 'rgba(255,255,255,0.12)';
                pCtx.lineWidth = 1;
                pCtx.strokeRect(btn.x, btn.y, btn.w, btn.h);

                pCtx.fillStyle = btn.col || '#ffffff';
                pCtx.font = 'bold 15px Arial, sans-serif';
                pCtx.textAlign = 'center';
                pCtx.textBaseline = 'middle';
                pCtx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2);
            });

            phoneTexture.needsUpdate = true;
        }
        redrawPhoneUI();

        function handleCalcInput(val) {
            if (val === 'AC') {
                expression = "";
                resultOutput = "0";
            } else if (val === 'DEL') {
                expression = expression.slice(0, -1);
            } else if (val === 'SD') {
                resultOutput = "0.16";
            } else {
                if (expression === "4÷100") expression = "";
                expression += val;
            }
            redrawPhoneUI();
        }

        function handleCalculate() {
            try {
                let evalStr = expression.replace(/÷/g, '/').replace(/×/g, '*');
                let evaluated = eval(evalStr);
                if (evaluated === 0.04 || evaluated === 4/100) {
                    resultOutput = "1\n25"; 
                } else {
                    resultOutput = Number.isFinite(evaluated) ? evaluated.toString() : "Math Error";
                }
            } catch (err) {
                resultOutput = "Syntax Error";
            }
            redrawPhoneUI();
        }

        // --- THREE.JS 3D SCENE ---
        const container = document.getElementById('webgl-container');
        const width = container.clientWidth || 400;
        const height = container.clientHeight || 700;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
        camera.position.set(0, 0, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3.5;
        controls.maxDistance = 7.0;

        scene.add(new THREE.AmbientLight(0xffffff, 1.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 1.2);
        backLight.position.set(-5, -5, -7);
        scene.add(backLight);

        const phoneGroup = new THREE.Group();

        // Phone body dimensions
        const shape = new THREE.Shape();
        const pw = 2.36, ph = 4.76, r = 0.15;
        shape.moveTo(-pw/2 + r, -ph/2);
        shape.lineTo(pw/2 - r, -ph/2);
        shape.quadraticCurveTo(pw/2, -ph/2, pw/2, -ph/2 + r);
        shape.lineTo(pw/2, ph/2 - r);
        shape.quadraticCurveTo(pw/2, ph/2, pw/2 - r, ph/2);
        shape.lineTo(-pw/2 + r, ph/2);
        shape.quadraticCurveTo(-pw/2, ph/2, -pw/2, ph/2 - r);
        shape.lineTo(-pw/2, -ph/2 + r);
        shape.quadraticCurveTo(-pw/2, -ph/2, -pw/2 + r, -ph/2);

        const extrudeSettings = { depth: 0.18, bevelEnabled: true, bevelSegments: 3, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 };
        const phoneGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        phoneGeo.center();

        // Titanium Blue Phone Body & Frame Material
        const phoneMat = new THREE.MeshStandardMaterial({ color: 0x8ab6d6, roughness: 0.25, metalness: 0.85 });
        const phoneBody = new THREE.Mesh(phoneGeo, phoneMat);
        phoneGroup.add(phoneBody);

        // Solid Black Front Glass Screen Body with UI mapped onto it properly facing forward
        const screenGeo = new THREE.PlaneGeometry(2.20, 4.60);
        const screenMat = new THREE.MeshBasicMaterial({ map: phoneTexture });
        const screenMesh = new THREE.Mesh(screenGeo, screenMat);
        screenMesh.position.z = 0.102;
        phoneGroup.add(screenMesh);

        // Titanium Blue Back Panel
        const backGeo = new THREE.PlaneGeometry(2.20, 4.60);
        const backMat = new THREE.MeshStandardMaterial({ color: 0x76a3c7, roughness: 0.3, metalness: 0.8 });
        const backPanel = new THREE.Mesh(backGeo, backMat);
        backPanel.position.z = -0.102;
        backPanel.rotation.y = Math.PI;
        phoneGroup.add(backPanel);

        // --- PRECISE CAMERA LAYOUT MATCHING YOUR DRAWING ---
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.15, metalness: 0.99 });
        const innerLensMat = new THREE.MeshStandardMaterial({ color: 0x020202, roughness: 0.05, metalness: 0.95 });
        const flashMat = new THREE.MeshBasicMaterial({ color: 0xffffee });

        // Left vertical column (3 large camera rings)
        const leftColumnLenses = [
            { y: 1.65, r: 0.13 }, 
            { y: 1.20, r: 0.13 }, 
            { y: 0.75, r: 0.13 }  
        ];

        leftColumnLenses.forEach((pos) => {
            const ring = new THREE.Mesh(new THREE.CylinderGeometry(pos.r, pos.r, 0.04, 32), ringMat);
            ring.rotation.x = Math.PI / 2;
            const glassLens = new THREE.Mesh(new THREE.CylinderGeometry(pos.r * 0.75, pos.r * 0.75, 0.045, 32), innerLensMat);
            glassLens.rotation.x = Math.PI / 2;

            ring.position.set(-0.50, pos.y, -0.125);
            glassLens.position.set(-0.50, pos.y, -0.125);
            phoneGroup.add(ring);
            phoneGroup.add(glassLens);
        });

        // Right side: Top lens, middle flash dot, bottom sensor dot (matching your sketch layout)
        const rightLens = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.04, 32), ringMat);
        rightLens.rotation.x = Math.PI / 2;
        const rightGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.13 * 0.75, 0.13 * 0.75, 0.045, 32), innerLensMat);
        rightGlass.rotation.x = Math.PI / 2;
        rightLens.position.set(-0.05, 1.65, -0.125);
        rightGlass.position.set(-0.05, 1.65, -0.125);
        phoneGroup.add(rightLens);
        phoneGroup.add(rightGlass);

        // Flash dot (middle right)
        const flash = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.03, 16), flashMat);
        flash.rotation.x = Math.PI / 2;
        flash.position.set(-0.05, 1.20, -0.125);
        phoneGroup.add(flash);

        // Sensor dot (bottom right)
        const sensor = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.03, 16), innerLensMat);
        sensor.rotation.x = Math.PI / 2;
        sensor.position.set(-0.05, 0.85, -0.125);
        phoneGroup.add(sensor);

        scene.add(phoneGroup);

        // Click interaction on buttons
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            if (event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom) {
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(screenMesh);

                if (intersects.length > 0) {
                    const uv = intersects[0].uv;
                    const clickX = uv.x * phoneCanvas.width;
                    const clickY = (1 - uv.y) * phoneCanvas.height;

                    for (let btn of calcButtons) {
                        if (clickX >= btn.x && clickX <= btn.x + btn.w && clickY >= btn.y && clickY <= btn.y + btn.h) {
                            if (btn.val === '=') handleCalculate();
                            else if (btn.val) handleCalcInput(btn.val);
                            break;
                        }
                    }
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w = container.clientWidth || 400;
            const h = container.clientHeight || 700;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
