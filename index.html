<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student GPA & 3D Interactive Casio Calculator</title>
    
    <!-- Load Three.js, OrbitControls, and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 1300px; margin: auto; overflow-x: hidden; }
        .main-container { display: flex; gap: 40px; flex-wrap: wrap; align-items: center; justify-content: center; min-height: 85vh; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); flex: 1; min-width: 300px; max-width: 380px; z-index: 10; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn-action { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-action:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 1.2rem; text-align: center; color: #2ecc71; font-weight: bold; }
        .course-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px 10px; margin-top: 5px; border-radius: 4px; font-size: 0.85rem; }

        .calculator-wrapper {
            position: relative;
            width: 440px;
            height: 650px;
            background: radial-gradient(circle, #1a1c23 0%, #111215 100%);
            border-radius: 20px;
            border: 2px solid #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #webgl-container { width: 100%; height: 100%; cursor: grab; }
        #webgl-container:active { cursor: grabbing; }

        .calc-lcd-overlay {
            position: absolute;
            top: 160px;
            left: 115px;
            width: 210px;
            height: 70px;
            background: #8fa096;
            color: #111;
            border-radius: 3px;
            padding: 5px;
            box-sizing: border-box;
            font-family: monospace;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
            z-index: 5;
        }
        .lcd-main-row { font-size: 0.8rem; font-weight: bold; text-align: right; }
        .lcd-gpa-row { font-size: 0.85rem; font-weight: bold; color: #8b0000; text-align: right; }

        /* Status banner printed directly on the page */
        #status-banner {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #3498db;
            z-index: 20;
            border: 1px solid #444;
            text-align: center;
            max-width: 90%;
        }

        .instruction-badge { 
            position: absolute; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.8); 
            padding: 8px 15px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            color: #f1c40f; 
            font-weight: bold; 
            pointer-events: none;
            border: 1px solid #444;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- LEFT: GPA Calculator Form -->
        <div class="card">
            <h2>GPA Calculator</h2>
            <p style="color: #aaa; font-size: 0.9rem;">Calculate your semester grade point average easily.</p>
            
            <label>Course Name / Code</label>
            <input type="text" id="courseName" placeholder="e.g. Computer Architecture">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button class="btn-action" onclick="addCourse()">Add Course</button>
            <button class="btn-action" style="background:#c0392b;" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #ccc;"></div>
            <div id="result"></div>
        </div>

        <!-- RIGHT: Real 3D Casio Model Viewer -->
        <div class="calculator-wrapper">
            <div id="status-banner">Initializing 3D Viewer...</div>
            <div id="webgl-container"></div>
            
            <!-- Live Screen Data -->
            <div class="calc-lcd-overlay">
                <div class="lcd-main-row" id="calcFormula">Sum(Pts×Cr)/Sum(Cr)</div>
                <div class="lcd-gpa-row" id="calcAnswer">GPA: 0.00</div>
            </div>

            <div class="instruction-badge">🖱️ Left-Click: Rotate | Scroll: Zoom | Right-Click: Shift</div>
        </div>
    </div>

    <!-- JavaScript Execution Engine -->
    <script>
        let totalPoints = 0;
        let totalCredits = 0;

        function addCourse() {
            const nameField = document.getElementById('courseName');
            const name = nameField.value || "Course";
            const points = parseFloat(document.getElementById('gradePoints').value);
            const credits = parseFloat(document.getElementById('credits').value);

            if (isNaN(credits) || credits <= 0) {
                alert("Please enter valid credit hours.");
                return;
            }

            totalPoints += (points * credits);
            totalCredits += credits;
            const gpa = (totalPoints / totalCredits).toFixed(2);
            
            document.getElementById('courseList').innerHTML += `<div class="course-row"><span>✔️ ${name} (${credits} Cr)</span><span>Pts: ${points}</span></div>`;
            document.getElementById('result').innerHTML = `Current Semester GPA: ${gpa}`;
            document.getElementById('calcFormula').innerText = `${totalPoints} Pts / ${totalCredits} Cr`;
            document.getElementById('calcAnswer').innerText = `SEM GPA: ${gpa}`;
            nameField.value = '';
        }

        function resetGPA() {
            totalPoints = 0;
            totalCredits = 0;
            document.getElementById('courseList').innerHTML = '';
            document.getElementById('result').innerHTML = '';
            document.getElementById('calcFormula').innerText = "Sum(Pts×Cr)/Sum(Cr)";
            document.getElementById('calcAnswer').innerText = "GPA: 0.00";
        }

        // --- THREE.JS 3D SETUP ---
        const container = document.getElementById('webgl-container');
        const statusBanner = document.getElementById('status-banner');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- ATTEMPT TO LOAD MODEL WITH SCREEN FEEDBACK ---
        statusBanner.innerText = "Attempting to load: models/casio3d.glb";

        const loader = new THREE.GLTFLoader();
        loader.load('models/casio3d.glb', function (gltf) {
            statusBanner.innerText = "Model loaded successfully!";
            statusBanner.style.color = "#2ecc71";
            
            const calculatorMesh = gltf.scene;
            calculatorMesh.scale.set(1.5, 1.5, 1.5);
            calculatorMesh.position.set(0, -0.5, 0);
            scene.add(calculatorMesh);
        }, undefined, function (error) {
            statusBanner.innerText = "FAILED to load model! Check folder path.";
            statusBanner.style.color = "#e74c3c";
            console.error('GLTF Load Error:', error);

            // Fallback: Add a bright red cube so you know 3D rendering works
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            const material = new THREE.MeshStandardMaterial({ color: 0xff0000 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
        });

        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
