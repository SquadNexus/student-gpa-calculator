<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student GPA & 3D Interactive Casio Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 1250px; margin: auto; overflow-x: hidden; }
        
        .main-container { display: flex; gap: 50px; flex-wrap: wrap; align-items: center; justify-content: center; min-height: 85vh; perspective: 1500px; }
        
        /* Left GPA Card */
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); flex: 1; min-width: 300px; max-width: 380px; z-index: 10; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn-action { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-action:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 1.2rem; text-align: center; color: #2ecc71; font-weight: bold; }
        .course-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px 10px; margin-top: 5px; border-radius: 4px; font-size: 0.85rem; }

        /* --- 3D SCENE & CASIO BOX CONTAINER --- */
        .scene {
            width: 340px;
            height: 600px;
            perspective: 1400px;
            cursor: pointer;
        }

        .casio-3d-model {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform: rotateX(8deg) rotateY(-18deg);
        }

        /* Hover tilts and reveals the 3D depth of the calculator */
        .scene:hover .casio-3d-model {
            transform: rotateX(15deg) rotateY(-30deg) translateZ(20px);
        }

        /* 3D Sides/Volume Styling */
        .side {
            position: absolute;
            background: #121418;
            border: 1px solid #2a2f38;
            box-sizing: border-box;
        }

        /* 1. FRONT FACE (Contains the Fully Working Calculator) */
        .face-front {
            width: 340px;
            height: 600px;
            transform: translateZ(18px);
            border-radius: 16px;
            padding: 16px;
            background: linear-gradient(145deg, #1c1f26, #111317);
            border: 2px solid #2e3440;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* 2. BACK FACE */
        .face-back {
            width: 340px;
            height: 600px;
            transform: rotateY(180deg) translateZ(18px);
            border-radius: 16px;
            background: #0d0f12;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #252a33;
            color: #555;
        }

        /* 3 & 4. LEFT & RIGHT THICKNESS SIDES */
        .side-left {
            width: 36px;
            height: 600px;
            left: -18px;
            transform: rotateY(-90deg) translateZ(170px);
            background: #090a0d;
        }
        .side-right {
            width: 36px;
            height: 600px;
            right: -18px;
            transform: rotateY(90deg) translateZ(170px);
            background: #171a20;
        }

        /* 5 & 6. TOP & BOTTOM THICKNESS SIDES */
        .side-top {
            width: 340px;
            height: 36px;
            top: -18px;
            transform: rotateX(90deg) translateZ(282px);
            background: #101216;
        }
        .side-bottom {
            width: 340px;
            height: 36px;
            bottom: -18px;
            transform: rotateX(-90deg) translateZ(282px);
            background: #08090b;
        }

        /* --- CALCULATOR INTERFACE STYLING --- */
        .calc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .calc-brand { font-size: 0.75rem; font-weight: bold; color: #aaa; letter-spacing: 1px; }
        .calc-model { font-size: 0.65rem; color: #f1c40f; font-weight: bold; }

        .calc-lcd { 
            background: #8fa096; 
            color: #111; 
            padding: 10px; 
            border-radius: 6px; 
            border: 3px solid #1a1e24;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6);
            margin-bottom: 12px; 
            font-family: monospace; 
        }
        .lcd-top { font-size: 0.55rem; color: #2c3e50; display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #78877e; padding-bottom: 2px; margin-bottom: 4px; }
        .lcd-screen { font-size: 1.4rem; min-height: 38px; text-align: right; font-weight: bold; overflow-x: auto; display: flex; flex-direction: column; justify-content: flex-end; }

        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .ckey { 
            background: linear-gradient(to bottom, #2c3038, #1c1f26); 
            color: #fff; 
            border: 1px solid #363c48; 
            border-bottom: 3px solid #0a0c0f;
            padding: 8px 0; 
            font-size: 0.75rem; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold; 
            text-align: center; 
            box-shadow: 0 3px 5px rgba(0,0,0,0.4);
            transition: all 0.05s ease;
        }
        .ckey:active { transform: translateY(2px); border-bottom: 1px solid #0a0c0f; }
        .ckey:hover { background: linear-gradient(to bottom, #383f4d, #252932); }
        .ckey span { display: block; font-size: 0.45rem; color: #3498db; margin-top: 2px; font-weight: normal; }
        
        .ckey.action { background: linear-gradient(to bottom, #27ae60, #1e8449); border-color: #145a32; }
        .ckey.equals { background: linear-gradient(to bottom, #2980b9, #1f618d); border-color: #154360; }

        .instruction-badge { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- LEFT: GPA Calculator -->
        <div class="card">
            <h2>GPA Calculator</h2>
            <p style="color: #aaa; font-size: 0.9rem;">Calculate your semester grade point average easily.</p>
            
            <label>Course Name / Code</label>
            <input type="text" id="courseName" placeholder="e.g. Computer Architecture">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button class="btn-action" onclick="addCourse()">Add Course</button>
            <button class="btn-action" style="background:#c0392b;" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #ccc;"></div>
            <div id="result"></div>
        </div>

        <!-- RIGHT: 3D Interactive Casio Calculator Device -->
        <div>
            <div class="scene">
                <div class="casio-3d-model">
                    
                    <!-- FRONT FACE: Real Interactive Calculator -->
                    <div class="side face-front">
                        <div class="calc-header">
                            <span class="calc-brand">CASIO fx-82ES PLUS</span>
                            <span class="calc-model">2nd EDITION</span>
                        </div>

                        <div class="calc-lcd">
                            <div class="lcd-top">
                               <span>Math DEG</span>
                               <span>FIX</span>
                            </div>
                            <div class="lcd-screen" id="calcScreen">0</div>
                        </div>

                        <div class="calc-grid">
                            <button class="ckey" onclick="pressKey('Math.sin(')">sin<span>sin⁻¹</span></button>
                            <button class="ckey" onclick="pressKey('Math.cos(')">cos<span>cos⁻¹</span></button>
                            <button class="ckey" onclick="pressKey('Math.tan(')">tan<span>tan⁻¹</span></button>
                            <button class="ckey" onclick="pressKey('Math.sqrt(')">√<span>x²</span></button>

                            <button class="ckey" onclick="pressKey('(')">(<span> </span></button>
                            <button class="ckey" onclick="pressKey(')')">)<span> </span></button>
                            <button class="ckey action" onclick="pressKey('DEL')">DEL</button>
                            <button class="ckey action" onclick="pressKey('AC')">AC</button>

                            <button class="ckey" onclick="pressKey('7')">7</button>
                            <button class="ckey" onclick="pressKey('8')">8</button>
                            <button class="ckey" onclick="pressKey('9')">9</button>
                            <button class="ckey" onclick="pressKey('/')">÷</button>

                            <button class="ckey" onclick="pressKey('4')">4</button>
                            <button class="ckey" onclick="pressKey('5')">5</button>
                            <button class="ckey" onclick="pressKey('6')">6</button>
                            <button class="ckey" onclick="pressKey('*')">×</button>

                            <button class="ckey" onclick="pressKey('1')">1</button>
                            <button class="ckey" onclick="pressKey('2')">2</button>
                            <button class="ckey" onclick="pressKey('3')">3</button>
                            <button class="ckey" onclick="pressKey('-')">-</button>

                            <button class="ckey" onclick="pressKey('0')">0</button>
                            <button class="ckey" onclick="pressKey('.')">.</button>
                            <button class="ckey" onclick="pressKey('Math.PI')">π</button>
                            <button class="ckey" onclick="pressKey('+')">+</button>

                            <button class="ckey" style="grid-column: span 2;" onclick="pressKey('Ans')">Ans</button>
                            <button class="ckey equals" style="grid-column: span 2;" onclick="calculateResult()">=</button>
                        </div>
                    </div>

                    <!-- BACK FACE -->
                    <div class="side face-back">
                        <h3 style="color:#aaa; margin:0;">CASIO</h3>
                        <p style="font-size:0.75rem;">Dual Power / Battery</p>
                    </div>

                    <!-- 3D THICKNESS SIDES -->
                    <div class="side side-left"></div>
                    <div class="side side-right"></div>
                    <div class="side side-top"></div>
                    <div class="side side-bottom"></div>

                </div>
            </div>
            <div class="instruction-badge">💡 Hover over the calculator to view its 3D depth while using it!</div>
        </div>
    </div>

    <!-- JavaScript Execution Engine -->
    <script>
        // --- GPA LOGIC ---
        let totalPoints = 0;
        let totalCredits = 0;

        function addCourse() {
            const nameField = document.getElementById('courseName');
            const name = nameField.value || "Course";
            const points = parseFloat(document.getElementById('gradePoints').value);
            const credits = parseFloat(document.getElementById('credits').value);

            if (isNaN(credits) || credits <= 0) {
                alert("Please enter valid credit hours.");
                return;
            }

            totalPoints += (points * credits);
            totalCredits += credits;

            const gpa = (totalPoints / totalCredits).toFixed(2);
            
            document.getElementById('courseList').innerHTML += `<div class="course-row"><span>✔️ ${name} (${credits} Credits)</span><span>Pts: ${points}</span></div>`;
            document.getElementById('result').innerHTML = `Current Semester GPA: ${gpa}`;
            nameField.value = '';
        }

        function resetGPA() {
            totalPoints = 0;
            totalCredits = 0;
            document.getElementById('courseList').innerHTML = '';
            document.getElementById('result').innerHTML = '';
        }

        // --- CALCULATOR LOGIC ---
        let expression = "";
        let lastAns = "0";

        function pressKey(val) {
            const screen = document.getElementById('calcScreen');

            if (val === 'AC') {
                expression = "";
                screen.innerText = "0";
                return;
            }
            if (val === 'DEL') {
                expression = expression.slice(0, -1);
                screen.innerText = expression === "" ? "0" : expression;
                return;
            }
            if (val === 'Ans') {
                expression += lastAns;
            } else {
                if (expression === "0" && val !== '.') {
                    expression = val;
                } else {
                    expression += val;
                }
            }
            
            let cleanDisplay = expression.replace(/Math\.sin\(/g, "sin(")
                                         .replace(/Math\.cos\(/g, "cos(")
                                         .replace(/Math\.tan\(/g, "tan(")
                                         .replace(/Math\.sqrt\(/g, "√(")
                                         .replace(/Math\.PI/g, "π");
            screen.innerText = cleanDisplay;
        }

        function calculateResult() {
            const screen = document.getElementById('calcScreen');
            try {
                let evaluated = eval(expression.replace(/Math\.PI/g, Math.PI));
                evaluated = Math.round(evaluated * 100000000) / 100000000;
                
                lastAns = Number.isFinite(evaluated) ? evaluated.toString() : "Error";
                screen.innerText = lastAns;
                expression = lastAns;
            } catch (err) {
                screen.innerText = "Syntax Error";
                expression = "";
            }
        }
    </script>
</body>
</html>
