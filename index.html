<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator & True 3D Phone Calculator</title>
    
    <!-- Load Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f7f6; 
            color: #333; 
            padding: 20px; 
            max-width: 1200px; 
            margin: auto; 
        }

        .main-container { 
            display: flex; 
            gap: 40px; 
            flex-wrap: wrap; 
            align-items: center; 
            justify-content: center; 
        }

        /* GPA Card Styling */
        .card { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            border: 1px solid #e1e4e8;
            flex: 1; 
            min-width: 320px; 
            max-width: 400px; 
        }

        .card h2 { margin-top: 0; color: #111; }
        label { font-weight: bold; font-size: 0.85rem; color: #444; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin: 8px 0 15px 0; 
            background: #f9fafb; 
            border: 1px solid #d1d5db; 
            color: #333; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        button { 
            background: #0066cc; 
            color: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 5px; 
        }
        button:hover { background: #0052a3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #b02a37; }

        #result { 
            margin-top: 20px; 
            font-size: 1.2rem; 
            text-align: center; 
            color: #198754; 
            font-weight: bold; 
        }

        .course-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #f1f3f5; 
            padding: 8px 12px; 
            margin-top: 6px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            border: 1px solid #e9ecef;
        }

        /* --- TRUE 3D VIEWPORT CONTAINER --- */
        .calculator-3d-wrapper {
            position: relative;
            width: 420px;
            height: 720px;
            background: transparent;
            flex-shrink: 0;
        }

        #webgl-container { 
            width: 100%; 
            height: 100%; 
            display: block;
            cursor: grab; 
        }
        #webgl-container:active { cursor: grabbing; }

        .instruction-badge {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #0066cc;
            font-weight: bold;
            pointer-events: none;
            border: 1px solid #d1d5db;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- LEFT: GPA Calculator Card (Syncs automatically with 3D Phone Calculator) -->
        <div class="card">
            <h2>GPA & Calculator Sync</h2>
            <p style="color: #666; font-size: 0.9rem;">Calculations performed on the 3D phone sync here automatically.</p>
            
            <label>Course Name / Synced Calculation</label>
            <input type="text" id="courseName" placeholder="Synced from 3D Phone...">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button onclick="addCourse()">Add Course From Sync</button>
            <button class="btn-danger" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #444;"></div>
            <div id="result"></div>
        </div>

        <!-- RIGHT: True 3D Rotating Phone Device (S25 Style with Calculator Screen & Buttons mapped on body) -->
        <div class="calculator-3d-wrapper">
            <div id="webgl-container"></div>
            <div class="instruction-badge">🖱️ Drag to Rotate 3D Phone 360° (Front, Back & Sides)</div>
        </div>

    </div>

    <script>
        // --- GPA CALCULATOR LOGIC ---
        let totalPoints = 0;
        let totalCredits = 0;

        function addCourse() {
            const name = document.getElementById('courseName').value || "Calculation Entry";
            const points = parseFloat(document.getElementById('gradePoints').value);
            const credits = parseFloat(document.getElementById('credits').value);

            if (isNaN(credits) || credits <= 0) {
                alert("Please enter valid credit hours.");
                return;
            }

            totalPoints += (points * credits);
            totalCredits += credits;

            const gpa = (totalPoints / totalCredits).toFixed(2);
            
            document.getElementById('courseList').innerHTML += `<div class="course-row"><span>✔️ ${name} (${credits} Cr)</span><span>Pts: ${points}</span></div>`;
            document.getElementById('result').innerHTML = `Current Semester GPA: ${gpa}`;
        }

        function resetGPA() {
            totalPoints = 0;
            totalCredits = 0;
            document.getElementById('courseList').innerHTML = '';
            document.getElementById('result').innerHTML = '';
        }

        // --- CALCULATOR ENGINE MAPPED ONTO 3D PHONE ---
        let calcExpression = "25×4";
        let calcResultOutput = "100"; 

        const calcButtons = [
            { label: 'AC', val: 'AC', x: 20, y: 150, w: 105, h: 50, bg: '#e74c3c', col: '#fff' },
            { label: '(', val: '(', x: 135, y: 150, w: 105, h: 50, bg: '#34495e', col: '#fff' },
            { label: ')', val: ')', x: 250, y: 150, w: 105, h: 50, bg: '#34495e', col: '#fff' },
            { label: '÷', val: '/', x: 365, y: 150, w: 125, h: 50, bg: '#f39c12', col: '#fff' },

            { label: '7', val: '7', x: 20, y: 210, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '8', val: '8', x: 135, y: 210, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '9', val: '9', x: 250, y: 210, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '×', val: '*', x: 365, y: 210, w: 125, h: 60, bg: '#f39c12', col: '#fff' },

            { label: '4', val: '4', x: 20, y: 280, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '5', val: '5', x: 135, y: 280, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '6', val: '6', x: 250, y: 280, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '-', val: '-', x: 365, y: 280, w: 125, h: 60, bg: '#f39c12', col: '#fff' },

            { label: '1', val: '1', x: 20, y: 350, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '2', val: '2', x: 135, y: 350, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '3', val: '3', x: 250, y: 350, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '+', val: '+', x: 365, y: 350, w: 125, h: 60, bg: '#f39c12', col: '#fff' },

            { label: '0', val: '0', x: 20, y: 420, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '.', val: '.', x: 135, y: 420, w: 105, h: 60, bg: '#2c3e50', col: '#fff' },
            { label: '⌫', val: 'DEL', x: 250, y: 420, w: 105, h: 60, bg: '#d35400', col: '#fff' },
            { label: '=', val: '=', x: 365, y: 420, w: 125, h: 60, bg: '#27ae60', col: '#fff' }
        ];

        // Dynamic Canvas Texture mapped onto the 3D Phone Screen
        const phoneCanvas = document.createElement('canvas');
        phoneCanvas.width = 512;
        phoneCanvas.height = 512;
        const pCtx = phoneCanvas.getContext('2d');
        const phoneTexture = new THREE.CanvasTexture(phoneCanvas);
        phoneTexture.generateMipmaps = true;
        phoneTexture.minFilter = THREE.LinearMipmapLinearFilter;

        function redrawPhoneUI() {
            // Background Phone App Theme
            pCtx.fillStyle = '#1e272e';
            pCtx.fillRect(0, 0, phoneCanvas.width, phoneCanvas.height);

            // Screen Box
            pCtx.fillStyle = '#d2f8d2';
            pCtx.fillRect(20, 25, 470, 105);
            pCtx.strokeStyle = '#2f3640';
            pCtx.lineWidth = 3;
            pCtx.strokeRect(20, 25, 470, 105);

            // Expression
            pCtx.fillStyle = '#353b48';
            pCtx.font = 'bold 22px monospace';
            pCtx.fillText(calcExpression, 35, 65);

            // Result
            pCtx.fillStyle = '#000000';
            pCtx.font = 'bold 36px monospace';
            pCtx.textAlign = 'right';
            pCtx.fillText(calcResultOutput, 475, 110);
            pCtx.textAlign = 'left';

            // Keypad
            calcButtons.forEach(btn => {
                pCtx.fillStyle = btn.bg;
                pCtx.fillRect(btn.x, btn.y, btn.w, btn.h);
                pCtx.strokeStyle = '#ffffff';
                pCtx.lineWidth = 1;
                pCtx.strokeRect(btn.x, btn.y, btn.w, btn.h);

                pCtx.fillStyle = btn.col || '#ffffff';
                pCtx.font = 'bold 20px Arial, sans-serif';
                pCtx.textAlign = 'center';
                pCtx.textBaseline = 'middle';
                pCtx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2);
            });

            phoneTexture.needsUpdate = true;
        }
        redrawPhoneUI();

        function handleCalcInput(val) {
            if (val === 'AC') {
                calcExpression = "";
                calcResultOutput = "0";
            } else if (val === 'DEL') {
                calcExpression = calcExpression.slice(0, -1);
            } else {
                if (calcExpression === "25×4" || calcExpression === "0") calcExpression = "";
                calcExpression += val;
            }
            redrawPhoneUI();
        }

        function handleCalculate() {
            try {
                let evalStr = calcExpression.replace(/÷/g, '/').replace(/×/g, '*');
                let evaluated = eval(evalStr);
                calcResultOutput = Number.isFinite(evaluated) ? evaluated.toString() : "Error";
                
                // Automatically sync result into GPA calculator input field
                document.getElementById('courseName').value = `Phone Calc: ${calcExpression} = ${calcResultOutput}`;
            } catch (err) {
                calcResultOutput = "Error";
            }
            redrawPhoneUI();
        }

        // --- THREE.JS 3D SCENE SETUP ---
        const container = document.getElementById('webgl-container');
        const width = container.clientWidth || 420;
        const height = container.clientHeight || 720;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
        camera.position.set(0, 0, 5.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3.5;
        controls.maxDistance = 7.5;

        // Lighting for 3D depth and metallic casing reflections
        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const backLight = new THREE.DirectionalLight(0xffffff, 1.0);
        backLight.position.set(-5, -5, -7);
        scene.add(backLight);

        // 3D Phone Group
        const phoneGroup = new THREE.Group();

        // Extruded 3D Phone Body Shape (Samsung S25 Ultra style with rounded corners & physical thickness)
        const shape = new THREE.Shape();
        const pw = 2.6, ph = 4.8, r = 0.18;
        shape.moveTo(-pw/2 + r, -ph/2);
        shape.lineTo(pw/2 - r, -ph/2);
        shape.quadraticCurveTo(pw/2, -ph/2, pw/2, -ph/2 + r);
        shape.lineTo(pw/2, ph/2 - r);
        shape.quadraticCurveTo(pw/2, ph/2, pw/2 - r, ph/2);
        shape.lineTo(-pw/2 + r, ph/2);
        shape.quadraticCurveTo(-pw/2, ph/2, -pw/2, ph/2 - r);
        shape.lineTo(-pw/2, -ph/2 + r);
        shape.quadraticCurveTo(-pw/2, -ph/2, -pw/2 + r, -ph/2);

        const extrudeSettings = { depth: 0.22, bevelEnabled: true, bevelSegments: 4, steps: 1, bevelSize: 0.03, bevelThickness: 0.03 };
        const phoneGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        phoneGeo.center();

        // Titanium Slate Phone Body Material
        const phoneMat = new THREE.MeshStandardMaterial({ color: 0x34495e, roughness: 0.2, metalness: 0.85 });
        const phoneBody = new THREE.Mesh(phoneGeo, phoneMat);
        phoneGroup.add(phoneBody);

        // Front Screen Plane mapped with Calculator UI
        const screenGeo = new THREE.PlaneGeometry(2.35, 4.50);
        const screenMat = new THREE.MeshBasicMaterial({ map: phoneTexture });
        const screenMesh = new THREE.Mesh(screenGeo, screenMat);
        screenMesh.position.z = 0.125;
        phoneGroup.add(screenMesh);

        // Back Panel Design
        const backGeo = new THREE.PlaneGeometry(2.35, 4.50);
        const backMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.3, metalness: 0.7 });
        const backPanel = new THREE.Mesh(backGeo, backMat);
        backPanel.position.z = -0.125;
        backPanel.rotation.y = Math.PI;
        phoneGroup.add(backPanel);

        // S25 Style Back Camera Lens Modules
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.95 });
        const lensGlassMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.05, metalness: 0.99 });
        const flashMat = new THREE.MeshBasicMaterial({ color: 0xfffaed });

        const backCameras = [
            { x: -0.55, y: 1.70, r: 0.14 },
            { x: -0.55, y: 1.25, r: 0.14 },
            { x: -0.55, y: 0.80, r: 0.14 }
        ];

        backCameras.forEach(pos => {
            const ring = new THREE.Mesh(new THREE.CylinderGeometry(pos.r, pos.r, 0.04, 32), ringMat);
            ring.rotation.x = Math.PI / 2;
            const glass = new THREE.Mesh(new THREE.CylinderGeometry(pos.r*0.75, pos.r*0.75, 0.045, 32), lensGlassMat);
            glass.rotation.x = Math.PI / 2;

            ring.position.set(pos.x, pos.y, -0.145);
            glass.position.set(pos.x, pos.y, -0.145);
            phoneGroup.add(ring);
            phoneGroup.add(glass);
        });

        // Flash Module on Back
        const flashMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.03, 16), flashMat);
        flashMesh.rotation.x = Math.PI / 2;
        flashMesh.position.set(-0.05, 1.70, -0.145);
        phoneGroup.add(flashMesh);

        scene.add(phoneGroup);

        // Click interaction directly on the 3D rotating phone screen buttons
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('pointerdown', (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            if (event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom) {
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(screenMesh);

                if (intersects.length > 0) {
                    const uv = intersects[0].uv;
                    const clickX = uv.x * phoneCanvas.width;
                    const clickY = (1 - uv.y) * phoneCanvas.height;

                    for (let btn of calcButtons) {
                        if (clickX >= btn.x && clickX <= btn.x + btn.w && clickY >= btn.y && clickY <= btn.y + btn.h) {
                            if (btn.val === '=') {
                                handleCalculate();
                            } else if (btn.val) {
                                handleCalcInput(btn.val);
                            }
                            break;
                        }
                    }
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const w = container.clientWidth || 420;
            const h = container.clientHeight || 720;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });
    </script>
</body>
</html>
