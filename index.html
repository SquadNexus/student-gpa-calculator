<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student GPA Calculator & Live S25 Ultra CalcES</title>
    
    <!-- Link Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Load Three.js and OrbitControls for Full 3D Mouse Rotation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="main-container">
        
        <!-- LEFT: GPA Calculator Card -->
        <div class="card">
            <h2>GPA Calculator</h2>
            <p style="color: #666; font-size: 0.9rem;">Calculate your semester grade point average easily.</p>
            
            <label>Course Name / Code</label>
            <input type="text" id="courseName" placeholder="e.g. Computer Architecture">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button onclick="addCourse()">Add Course</button>
            <button class="btn-danger" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #444;"></div>
            <div id="result"></div>
        </div>

        <!-- RIGHT: True 3D WebGL Realistic Silver S25 Ultra Viewport -->
        <div class="calculator-3d-wrapper">
            <div id="webgl-container"></div>
            <div class="instruction-badge">🖱️ Click & Drag to Rotate Silver S25 Ultra (5 Cameras)</div>
        </div>

    </div>

    <!-- Script file -->
    <script src="script.js"></script>
</body>
</html>
