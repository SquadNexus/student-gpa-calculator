<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student GPA & 3D Casio Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 1200px; margin: auto; }
        
        .main-container { display: flex; gap: 40px; flex-wrap: wrap; align-items: center; justify-content: center; min-height: 80vh; perspective: 1200px; }
        
        /* Left GPA Card */
        .card { background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); flex: 1; min-width: 300px; max-width: 380px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 1.2rem; text-align: center; color: #2ecc71; font-weight: bold; }
        .course-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px 10px; margin-top: 5px; border-radius: 4px; font-size: 0.85rem; }

        /* --- RIGHT: 3D Interactive Casio Calculator Box --- */
        .scene {
            width: 320px;
            height: 580px;
            perspective: 1000px;
        }

        .calculator-3d-box {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            cursor: pointer;
        }

        /* Hover or active class to spin and show sides */
        .calculator-3d-box:hover {
            transform: rotateY(-35deg) rotateX(15deg);
        }

        /* 3D Sides / Faces */
        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        /* Front Face (Your Casio Image) */
        .face-front {
            background: #111;
            transform: translateZ(15px);
        }
        .face-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid #333;
        }

        /* Back Face */
        .face-back {
            background: #1a1a1a;
            transform: rotateY(180deg) translateZ(15px);
            border: 3px solid #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* 3D Thickness Edges (Simulated via Box Shadow & Depth) */
        .instruction-badge {
            text-align: center;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #f1c40f;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- LEFT: GPA Calculator -->
        <div class="card">
            <h2>GPA Calculator</h2>
            <p style="color: #aaa; font-size: 0.9rem;">Calculate your semester grade point average easily.</p>
            
            <label>Course Name / Code</label>
            <input type="text" id="courseName" placeholder="e.g. Computer Architecture">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button onclick="addCourse()">Add Course</button>
            <button style="background:#c0392b;" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #ccc;"></div>
            <div id="result"></div>
        </div>

        <!-- RIGHT: 3D Rotating Casio Calculator -->
        <div>
            <div class="scene">
                <div class="calculator-3d-box">
                    <!-- Front Side showing your Casio image -->
                    <div class="face face-front">
                        <img src="casio.png" alt="Casio fx-82ES PLUS Calculator">
                    </div>
                    <!-- Back Side -->
                    <div class="face face-back">
                        <h3>CASIO fx-82ES PLUS</h3>
                        <p style="color: #aaa; font-size: 0.9rem;">Natural Textbook Display</p>
                        <p style="color: #3498db; font-size: 0.8rem; margin-top: 20px;">2nd Edition Scientific Calculator</p>
                    </div>
                </div>
            </div>
            <div class="instruction-badge">💡 Hover over the calculator to rotate it in 3D!</div>
        </div>
    </div>

    <script>
        let totalPoints = 0;
        let totalCredits = 0;

        function addCourse() {
            const name = document.getElementById('courseName').value || "Course";
            const points = parseFloat(document.getElementById('gradePoints').value);
            const credits = parseFloat(document.getElementById('credits').value);

            if (isNaN(credits) || credits <= 0) {
                alert("Please enter valid credit hours.");
                return;
            }

            totalPoints += (points * credits);
            totalCredits += credits;

            const gpa = (totalPoints / totalCredits).toFixed(2);
            
            document.getElementById('courseList').innerHTML += `<div class="course-row"><span>✔️ ${name} (${credits} Credits)</span><span>Pts: ${points}</span></div>`;
            document.getElementById('result').innerHTML = `Current Semester GPA: ${gpa}`;
            document.getElementById('courseName').value = '';
        }

        function resetGPA() {
            totalPoints = 0;
            totalCredits = 0;
            document.getElementById('courseList').innerHTML = '';
            document.getElementById('result').innerHTML = '';
        }
    </script>
</body>
</html>
