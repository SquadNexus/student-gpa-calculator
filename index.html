<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student GPA & 3D Interactive Casio Calculator</title>
    
    <!-- Load Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 1300px; margin: auto; overflow-x: hidden; }
        
        .main-container { display: flex; gap: 40px; flex-wrap: wrap; align-items: center; justify-content: center; min-height: 85vh; }
        
        /* Left GPA Card */
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); flex: 1; min-width: 300px; max-width: 380px; z-index: 10; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn-action { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-action:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 1.2rem; text-align: center; color: #2ecc71; font-weight: bold; }
        .course-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px 10px; margin-top: 5px; border-radius: 4px; font-size: 0.85rem; }

        /* --- 3D CALCULATOR WRAPPER --- */
        .calculator-wrapper {
            position: relative;
            width: 440px;
            height: 650px;
            background: radial-gradient(circle, #1a1c23 0%, #111215 100%);
            border-radius: 20px;
            border: 2px solid #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #webgl-container:active {
            cursor: grabbing;
        }

        .instruction-badge { 
            position: absolute; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.8); 
            padding: 8px 15px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            color: #f1c40f; 
            font-weight: bold; 
            pointer-events: none;
            border: 1px solid #444;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- LEFT: GPA Calculator -->
        <div class="card">
            <h2>GPA Calculator</h2>
            <p style="color: #aaa; font-size: 0.9rem;">Calculate your semester grade point average easily.</p>
            
            <label>Course Name / Code</label>
            <input type="text" id="courseName" placeholder="e.g. Computer Architecture">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button class="btn-action" onclick="addCourse()">Add Course</button>
            <button class="btn-action" style="background:#c0392b;" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #ccc;"></div>
            <div id="result"></div>
        </div>

        <!-- RIGHT: 3D Casio Model with Left-Click Drag Rotation -->
        <div class="calculator-wrapper">
            <div id="webgl-container"></div>
            <div class="instruction-badge">🖱️ Click & drag LEFT mouse button to rotate 3D Casio</div>
        </div>
    </div>

    <!-- JavaScript Execution Engine -->
    <script>
        // --- GPA LOGIC & DYNAMIC TEXTURE GENERATION ---
        let totalPoints = 0;
        let totalCredits = 0;
        let currentFormula = "Sum(Pts × Cr) / Sum(Cr)";
        let currentAnswer = "GPA: 0.00";

        let casioTexture, calculatorMesh, canvasCtx, baseImage;

        function updateCalculatorScreen() {
            if (!canvasCtx || !baseImage) return;

            // 1. Redraw the base Casio image onto the dynamic canvas texture
            canvasCtx.drawImage(baseImage, 0, 0, 512, 1024);

            // 2. Draw live calculator screen background (the LCD area)
            canvasCtx.fillStyle = "#8fa096";
            canvasCtx.fillRect(55, 145, 400, 110);
            canvasCtx.strokeStyle = "#222";
            canvasCtx.lineWidth = 4;
            canvasCtx.strokeRect(55, 145, 400, 110);

            // 3. Render live text onto the LCD screen
            canvasCtx.fillStyle = "#111";
            canvasCtx.font = "bold 20px monospace";
            canvasCtx.fillText("Math DEG  STAT", 70, 175);

            canvasCtx.font = "bold 22px monospace";
            canvasCtx.fillText(currentFormula, 70, 205);

            canvasCtx.fillStyle = "#900";
            canvasCtx.font = "bold 24px monospace";
            canvasCtx.fillText(currentAnswer, 70, 238);

            // 4. Inform Three.js that the texture map has changed
            if (casioTexture) casioTexture.needsUpdate = true;
        }

        function addCourse() {
            const nameField = document.getElementById('courseName');
            const name = nameField.value || "Course";
            const points = parseFloat(document.getElementById('gradePoints').value);
            const credits = parseFloat(document.getElementById('credits').value);

            if (isNaN(credits) || credits <= 0) {
                alert("Please enter valid credit hours.");
                return;
            }

            totalPoints += (points * credits);
            totalCredits += credits;

            const gpa = (totalPoints / totalCredits).toFixed(2);
            
            document.getElementById('courseList').innerHTML += `<div class="course-row"><span>✔️ ${name} (${credits} Cr)</span><span>Pts: ${points}</span></div>`;
            document.getElementById('result').innerHTML = `Current Semester GPA: ${gpa}`;

            // Update text values shown directly inside the 3D model screen
            currentFormula = `${totalPoints} Pts / ${totalCredits} Cr`;
            currentAnswer = `SEM GPA = ${gpa}`;

            updateCalculatorScreen();
            nameField.value = '';
        }

        function resetGPA() {
            totalPoints = 0;
            totalCredits = 0;
            currentFormula = "Sum(Pts × Cr) / Sum(Cr)";
            currentAnswer = "GPA: 0.00";
            
            document.getElementById('courseList').innerHTML = '';
            document.getElementById('result').innerHTML = '';
            
            updateCalculatorScreen();
        }

        // --- THREE.JS 3D RENDERER CONFIGURATION ---
        const container = document.getElementById('webgl-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5.5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Configure OrbitControls to rotate using the LEFT mouse button
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 9;
        
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE, // <--- Left mouse button now rotates the model
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.PAN
        };

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1.2);
        pointLight.position.set(4, 5, 4);
        scene.add(pointLight);

        // Setup Dynamic Canvas Texture Mapping
        const dynCanvas = document.createElement('canvas');
        dynCanvas.width = 512;
        dynCanvas.height = 1024;
        canvasCtx = dynCanvas.getContext('2d');

        baseImage = new Image();
        baseImage.src = 'casio.png'; // Make sure your casio.png image file is in the same folder
        baseImage.onload = () => {
            updateCalculatorScreen();

            casioTexture = new THREE.CanvasTexture(dynCanvas);
            casioTexture.generateMipmaps = true;
            casioTexture.minFilter = THREE.LinearMipmapLinearFilter;

            const geometry = new THREE.BoxGeometry(2.3, 4.4, 0.28);
            
            const materials = [
                new THREE.MeshStandardMaterial({ color: 0x121417, roughness: 0.4 }),
                new THREE.MeshStandardMaterial({ color: 0x121417, roughness: 0.4 }),
                new THREE.MeshStandardMaterial({ color: 0x121417, roughness: 0.4 }),
                new THREE.MeshStandardMaterial({ color: 0x121417, roughness: 0.4 }),
                new THREE.MeshStandardMaterial({ map: casioTexture, roughness: 0.3 }), // Front face mapping image + text
                new THREE.MeshStandardMaterial({ color: 0x0a0b0d, roughness: 0.5 })
            ];

            calculatorMesh = new THREE.Mesh(geometry, materials);
            scene.add(calculatorMesh);

            calculatorMesh.rotation.x = 0.15;
            calculatorMesh.rotation.y = -0.3;

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        };

        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
