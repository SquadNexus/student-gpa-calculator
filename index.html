<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPA Calculator & 3D Calculator</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f7f6; 
            color: #333; 
            padding: 20px; 
            max-width: 1100px; 
            margin: auto; 
        }

        .main-container { 
            display: flex; 
            gap: 30px; 
            flex-wrap: wrap; 
            align-items: flex-start; 
            justify-content: center; 
        }

        /* Common Card Style */
        .card { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            border: 1px solid #e1e4e8;
            flex: 1; 
            min-width: 320px; 
            max-width: 420px; 
        }

        .card h2 { margin-top: 0; color: #111; }
        label { font-weight: bold; font-size: 0.85rem; color: #444; }
        input, select { 
            width: 100%; 
            padding: 10px; 
            margin: 8px 0 15px 0; 
            background: #f9fafb; 
            border: 1px solid #d1d5db; 
            color: #333; 
            border-radius: 6px; 
            box-sizing: border-box; 
        }
        .action-btn { 
            background: #0066cc; 
            color: white; 
            border: none; 
            padding: 12px; 
            width: 100%; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 5px; 
        }
        .action-btn:hover { background: #0052a3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #b02a37; }

        #gpaResult { 
            margin-top: 20px; 
            font-size: 1.2rem; 
            text-align: center; 
            color: #198754; 
            font-weight: bold; 
        }

        .course-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #f1f3f5; 
            padding: 8px 12px; 
            margin-top: 6px; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            border: 1px solid #e9ecef;
        }

        /* --- TRUE 3D REALISTIC CALCULATOR DESIGN --- */
        .calculator-3d-scene {
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .calculator-3d-chassis {
            background: linear-gradient(145deg, #2b323b 0%, #171b22 100%);
            padding: 24px;
            border-radius: 24px;
            /* Multi-layer box-shadow to achieve physical 3D depth and curved body bevels */
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.4), 
                0 10px 20px rgba(0,0,0,0.2),
                inset 0 2px 4px rgba(255,255,255,0.2), 
                inset 0 -8px 12px rgba(0,0,0,0.8),
                inset 3px 0 5px rgba(255,255,255,0.05),
                inset -3px 0 5px rgba(0,0,0,0.3);
            width: 350px;
            box-sizing: border-box;
            border: 2px solid #3c4654;
            transform: rotateX(6deg) rotateY(-4deg);
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .calculator-3d-chassis:hover {
            transform: rotateX(0deg) rotateY(0deg);
        }

        .calc-screen {
            background: #9bb1af;
            padding: 14px;
            border-radius: 10px;
            font-family: monospace;
            text-align: right;
            border: inset 3px #6b807e;
            margin-bottom: 22px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3), 0 2px 4px rgba(255,255,255,0.1);
        }

        #calc-history {
            font-size: 0.85rem;
            color: #2c3534;
            min-height: 18px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #calc-output {
            font-size: 1.7rem;
            font-weight: bold;
            color: #111;
            margin-top: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .calc-keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* Physical 3D Tactile Buttons */
        .calc-btn {
            background: linear-gradient(to bottom, #525f75, #2d3748);
            color: #ffffff;
            border: none;
            padding: 15px 0;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            /* 3D block extrusion shadow */
            box-shadow: 0 6px 0 #1a202c, 0 8px 8px rgba(0,0,0,0.4);
            transition: all 0.05s ease;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .calc-btn:hover {
            background: linear-gradient(to bottom, #5e6d85, #344054);
        }

        .calc-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #1a202c, 0 2px 3px rgba(0,0,0,0.3);
        }

        .btn-op {
            background: linear-gradient(to bottom, #ecc94b, #b7791f);
            box-shadow: 0 6px 0 #744210, 0 8px 8px rgba(0,0,0,0.4);
        }
        .btn-op:active { transform: translateY(5px); box-shadow: 0 1px 0 #744210, 0 2px 3px rgba(0,0,0,0.3); }

        .btn-clear {
            background: linear-gradient(to bottom, #f56565, #c53030);
            box-shadow: 0 6px 0 #742a2a, 0 8px 8px rgba(0,0,0,0.4);
        }
        .btn-clear:active { transform: translateY(5px); box-shadow: 0 1px 0 #742a2a, 0 2px 3px rgba(0,0,0,0.3); }

        .btn-equals {
            background: linear-gradient(to bottom, #38b2ac, #285e61);
            box-shadow: 0 6px 0 #134e4a, 0 8px 8px rgba(0,0,0,0.4);
        }
        .btn-equals:active { transform: translateY(5px); box-shadow: 0 1px 0 #134e4a, 0 2px 3px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- LEFT: GPA Calculator Card -->
        <div class="card">
            <h2>GPA Calculator</h2>
            <p style="color: #666; font-size: 0.9rem;">Calculate your semester grade point average easily.</p>
            
            <label>Course Name / Code</label>
            <input type="text" id="courseName" placeholder="e.g. Computer Architecture">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button class="action-btn" onclick="addCourse()">Add Course</button>
            <button class="action-btn btn-danger" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #444;"></div>
            <div id="gpaResult"></div>
        </div>

        <!-- RIGHT: True 3D Functional Calculator -->
        <div class="calculator-3d-scene">
            <div class="calculator-3d-chassis">
                <div class="calc-screen">
                    <div id="calc-history"></div>
                    <div id="calc-output">0</div>
                </div>
                
                <div class="calc-keypad">
                    <button class="calc-btn btn-clear" onclick="clearCalc()">AC</button>
                    <button class="calc-btn" onclick="appendValue('(')">(</button>
                    <button class="calc-btn" onclick="appendValue(')')">)</button>
                    <button class="calc-btn btn-op" onclick="appendValue('/')">÷</button>

                    <button class="calc-btn" onclick="appendValue('7')">7</button>
                    <button class="calc-btn" onclick="appendValue('8')">8</button>
                    <button class="calc-btn" onclick="appendValue('9')">9</button>
                    <button class="calc-btn btn-op" onclick="appendValue('*')">×</button>

                    <button class="calc-btn" onclick="appendValue('4')">4</button>
                    <button class="calc-btn" onclick="appendValue('5')">5</button>
                    <button class="calc-btn" onclick="appendValue('6')">6</button>
                    <button class="calc-btn btn-op" onclick="appendValue('-')">-</button>

                    <button class="calc-btn" onclick="appendValue('1')">1</button>
                    <button class="calc-btn" onclick="appendValue('2')">2</button>
                    <button class="calc-btn" onclick="appendValue('3')">3</button>
                    <button class="calc-btn btn-op" onclick="appendValue('+')">+</button>

                    <button class="calc-btn" onclick="appendValue('0')">0</button>
                    <button class="calc-btn" onclick="appendValue('.')">.</button>
                    <button class="calc-btn btn-clear" onclick="backspace()">⌫</button>
                    <button class="calc-btn btn-equals" onclick="calculateResult()">=</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- GPA CALCULATOR SCRIPT ---
        let totalPoints = 0;
        let totalCredits = 0;

        function addCourse() {
            const name = document.getElementById('courseName').value || "Course";
            const points = parseFloat(document.getElementById('gradePoints').value);
            const credits = parseFloat(document.getElementById('credits').value);

            if (isNaN(credits) || credits <= 0) {
                alert("Please enter valid credit hours.");
                return;
            }

            totalPoints += (points * credits);
            totalCredits += credits;

            const gpa = (totalPoints / totalCredits).toFixed(2);
            
            document.getElementById('courseList').innerHTML += `<div class="course-row"><span>✔️ ${name} (${credits} Credits)</span><span>Pts: ${points}</span></div>`;
            document.getElementById('gpaResult').innerHTML = `Current Semester GPA: ${gpa}`;
            document.getElementById('courseName').value = '';
        }

        function resetGPA() {
            totalPoints = 0;
            totalCredits = 0;
            document.getElementById('courseList').innerHTML = '';
            document.getElementById('gpaResult').innerHTML = '';
        }

        // Preload default course with grade points on page load as requested
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('courseName').value = "Calculated Result Entry";
            document.getElementById('gradePoints').value = "5";
            document.getElementById('credits').value = "3";
            addCourse();
        });

        // --- 3D CALCULATOR SCRIPT ---
        let currentInput = "0";
        let calculationHistory = "";

        const outputEl = document.getElementById('calc-output');
        const historyEl = document.getElementById('calc-history');

        function updateDisplay() {
            outputEl.textContent = currentInput;
            historyEl.textContent = calculationHistory;
        }

        function appendValue(val) {
            if (currentInput === "0" && val !== ".") {
                currentInput = val;
            } else {
                currentInput += val;
            }
            updateDisplay();
        }

        function clearCalc() {
            currentInput = "0";
            calculationHistory = "";
            updateDisplay();
        }

        function backspace() {
            if (currentInput.length > 1) {
                currentInput = currentInput.slice(0, -1);
            } else {
                currentInput = "0";
            }
            updateDisplay();
        }

        function calculateResult() {
            try {
                calculationHistory = currentInput;
                let sanitized = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
                let result = eval(sanitized);
                currentInput = Number.isFinite(result) ? result.toString() : "Error";
                
                // Automatically send/show calculation output in the GPA calculator entry fields as default
                if (Number.isFinite(result)) {
                    document.getElementById('courseName').value = `Calc: ${calculationHistory} = ${result}`;
                }
            } catch (err) {
                currentInput = "Error";
            }
            updateDisplay();
        }
    </script>
</body>
</html>
