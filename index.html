<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student GPA & 3D Interactive Casio Calculator</title>
    
    <!-- Load Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 1300px; margin: auto; overflow-x: hidden; }
        
        .main-container { display: flex; gap: 40px; flex-wrap: wrap; align-items: center; justify-content: center; min-height: 85vh; }
        
        /* Left GPA Card */
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); flex: 1; min-width: 300px; max-width: 380px; z-index: 10; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn-action { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-action:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 1.2rem; text-align: center; color: #2ecc71; font-weight: bold; }
        .course-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px 10px; margin-top: 5px; border-radius: 4px; font-size: 0.85rem; }

        /* --- 3D CALCULATOR VIEWPORT WRAPPER --- */
        .calculator-wrapper {
            position: relative;
            width: 440px;
            height: 650px;
            background: radial-gradient(circle, #1a1c23 0%, #111215 100%);
            border-radius: 20px;
            border: 2px solid #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #webgl-container:active {
            cursor: grabbing;
        }

        /* Live GPA Overlay aligned precisely over the 3D model's LCD screen */
        .calc-lcd-overlay {
            position: absolute;
            top: 130px;
            left: 95px;
            width: 250px;
            height: 75px;
            background: #9ead99;
            color: #111;
            border-radius: 4px;
            padding: 8px;
            box-sizing: border-box;
            font-family: monospace;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            z-index: 5;
            border: 2px solid #3b423d;
        }
        .lcd-main-row { font-size: 0.8rem; font-weight: bold; text-align: right; }
        .lcd-gpa-row { font-size: 0.9rem; font-weight: bold; color: #8b0000; text-align: right; }

        .instruction-badge { 
            position: absolute; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.8); 
            padding: 8px 15px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            color: #f1c40f; 
            font-weight: bold; 
            pointer-events: none;
            border: 1px solid #444;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- LEFT: GPA Calculator Form -->
        <div class="card">
            <h2>GPA Calculator</h2>
            <p style="color: #aaa; font-size: 0.9rem;">Calculate your semester grade point average easily.</p>
            
            <label>Course Name / Code</label>
            <input type="text" id="courseName" placeholder="e.g. Computer Architecture">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button class="btn-action" onclick="addCourse()">Add Course</button>
            <button class="btn-action" style="background:#c0392b;" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #ccc;"></div>
            <div id="result"></div>
        </div>

        <!-- RIGHT: Custom 3D Programmatic Casio Model Viewer -->
        <div class="calculator-wrapper">
            <div id="webgl-container"></div>
            
            <!-- Live Screen Data -->
            <div class="calc-lcd-overlay">
                <div class="lcd-main-row" id="calcFormula">Sum(Pts×Cr)/Sum(Cr)</div>
                <div class="lcd-gpa-row" id="calcAnswer">GPA: 0.00</div>
            </div>

            <div class="instruction-badge">🖱️ Left-Click: Rotate | Scroll: Zoom | Right-Click: Shift</div>
        </div>
    </div>

    <!-- JavaScript Execution Engine -->
    <script>
        // --- GPA LOGIC ---
        let totalPoints = 0;
        let totalCredits = 0;

        function addCourse() {
            const nameField = document.getElementById('courseName');
            const name = nameField.value || "Course";
            const points = parseFloat(document.getElementById('gradePoints').value);
            const credits = parseFloat(document.getElementById('credits').value);

            if (isNaN(credits) || credits <= 0) {
                alert("Please enter valid credit hours.");
                return;
            }

            totalPoints += (points * credits);
            totalCredits += credits;

            const gpa = (totalPoints / totalCredits).toFixed(2);
            
            document.getElementById('courseList').innerHTML += `<div class="course-row"><span>✔️ ${name} (${credits} Cr)</span><span>Pts: ${points}</span></div>`;
            document.getElementById('result').innerHTML = `Current Semester GPA: ${gpa}`;

            // Update calculator 3D overlay screen feedback
            document.getElementById('calcFormula').innerText = `${totalPoints} Pts / ${totalCredits} Cr`;
            document.getElementById('calcAnswer').innerText = `SEM GPA: ${gpa}`;

            nameField.value = '';
        }

        function resetGPA() {
            totalPoints = 0;
            totalCredits = 0;
            document.getElementById('courseList').innerHTML = '';
            document.getElementById('result').innerHTML = '';
            
            document.getElementById('calcFormula').innerText = "Sum(Pts×Cr)/Sum(Cr)";
            document.getElementById('calcAnswer').innerText = "GPA: 0.00";
        }

        // --- THREE.JS 3D PROCEDURAL CASIO CALCULATOR RENDERER ---
        const container = document.getElementById('webgl-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 0, 6.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // OrbitControls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 9;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 1.1));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // --- BUILD 3D CALCULATOR GROUP ---
        const calculatorGroup = new THREE.Group();

        // 1. Main Body Casing (Dark Matte Plastic)
        const bodyGeo = new THREE.BoxGeometry(3.0, 4.8, 0.35);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1c1e21, roughness: 0.4, metalness: 0.1 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        calculatorGroup.add(body);

        // 2. Inner Faceplate (Classic Grey/Silver Scientific Panel)
        const faceGeo = new THREE.BoxGeometry(2.7, 4.5, 0.38);
        const faceMat = new THREE.MeshStandardMaterial({ color: 0xdcdde1, roughness: 0.6 });
        const faceplate = new THREE.Mesh(faceGeo, faceMat);
        faceplate.position.z = 0.02;
        calculatorGroup.add(faceplate);

        // 3. LCD Screen Bezel / Recess
        const screenGeo = new THREE.BoxGeometry(2.3, 0.9, 0.40);
        const screenMat = new THREE.MeshStandardMaterial({ color: 0x2f3640, roughness: 0.2 });
        const screenBezel = new THREE.Mesh(screenGeo, screenMat);
        screenBezel.position.set(0, 1.55, 0.04);
        calculatorGroup.add(screenBezel);

        // 4. Directional Pad / Navigation Ring
        const dPadGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.08, 32);
        const dPadMat = new THREE.MeshStandardMaterial({ color: 0x485460, roughness: 0.3 });
        const dPad = new THREE.Mesh(dPadGeo, dPadMat);
        dPad.rotation.x = Math.PI / 2;
        dPad.position.set(0, 0.85, 0.05);
        calculatorGroup.add(dPad);

        // 5. Grid of Scientific Buttons
        const buttonMat = new THREE.MeshStandardMaterial({ color: 0x2f3640, roughness: 0.5 });
        const accentButtonMat = new THREE.MeshStandardMaterial({ color: 0xe056fd, roughness: 0.3 }); // Shift/Alpha keys
        const equalsButtonMat = new THREE.MeshStandardMaterial({ color: 0x0984e3, roughness: 0.3 }); // Equal key

        const rows = 6;
        const cols = 4;
        const btnWidth = 0.45;
        const btnHeight = 0.22;
        const startX = -0.9;
        const startY = 0.35;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let mat = buttonMat;
                if (r === 0 && c === 3) mat = accentButtonMat;
                if (r === rows - 1 && c === cols - 1) mat = equalsButtonMat;

                const btnGeo = new THREE.BoxGeometry(btnWidth, btnHeight, 0.08);
                const button = new THREE.Mesh(btnGeo, mat);
                
                const posX = startX + c * (btnWidth + 0.15);
                const posY = startY - r * (btnHeight + 0.12);
                
                button.position.set(posX, posY, 0.06);
                calculatorGroup.add(button);
            }
        }

        scene.add(calculatorGroup);

        // Gentle floating rotation idle effect
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            
            // Subtle tilt animation loop
            const elapsedTime = clock.getElapsedTime();
            calculatorGroup.rotation.y = Math.sin(elapsedTime * 0.5) * 0.15;
            calculatorGroup.rotation.x = Math.cos(elapsedTime * 0.4) * 0.08;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
