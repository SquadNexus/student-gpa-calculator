<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student GPA & Interactive 3D Casio Calculator</title>
    
    <!-- Load Three.js and OrbitControls for true 3D mouse rotation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 20px; max-width: 1300px; margin: auto; overflow-x: hidden; }
        
        .main-container { display: flex; gap: 40px; flex-wrap: wrap; align-items: center; justify-content: center; min-height: 85vh; }
        
        /* Left GPA Card */
        .card { background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); flex: 1; min-width: 300px; max-width: 380px; z-index: 10; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        .btn-action { background: #007bff; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-action:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 1.2rem; text-align: center; color: #2ecc71; font-weight: bold; }
        .course-row { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 6px 10px; margin-top: 5px; border-radius: 4px; font-size: 0.85rem; }

        /* --- 3D CANVAS WRAPPER --- */
        .calculator-wrapper {
            position: relative;
            width: 450px;
            height: 600px;
            background: radial-gradient(circle, #1a1c23 0%, #111215 100%);
            border-radius: 20px;
            border: 2px solid #333;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        #webgl-container {
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #webgl-container:active {
            cursor: grabbing;
        }

        .instruction-badge { 
            position: absolute; 
            bottom: 15px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: rgba(0, 0, 0, 0.7); 
            padding: 8px 15px; 
            border-radius: 20px; 
            font-size: 0.8rem; 
            color: #f1c40f; 
            font-weight: bold; 
            pointer-events: none;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- LEFT: GPA Calculator -->
        <div class="card">
            <h2>GPA Calculator</h2>
            <p style="color: #aaa; font-size: 0.9rem;">Calculate your semester grade point average easily.</p>
            
            <label>Course Name / Code</label>
            <input type="text" id="courseName" placeholder="e.g. Computer Architecture">
            
            <label>Grade & Points</label>
            <select id="gradePoints">
                <option value="5">A (5 Points)</option>
                <option value="4">B+ (4 Points)</option>
                <option value="3">B (3 Points)</option>
                <option value="2">C (2 Points)</option>
                <option value="1">D (1 Point)</option>
                <option value="0">F (0 Points)</option>
            </select>

            <label>Credit Hours / Units</label>
            <input type="number" id="credits" value="3" min="1" max="10">

            <button class="btn-action" onclick="addCourse()">Add Course</button>
            <button class="btn-action" style="background:#c0392b;" onclick="resetGPA()">Reset GPA</button>
            
            <div id="courseList" style="margin-top: 15px; font-size: 0.85rem; color: #ccc;"></div>
            <div id="result"></div>
        </div>

        <!-- RIGHT: True 3D Interactive WebGL Casio Object -->
        <div class="calculator-wrapper">
            <div id="webgl-container"></div>
            <div class="instruction-badge">🖱️ Click & drag to rotate 360° in 3D space</div>
        </div>
    </div>

    <!-- JavaScript Execution Engine -->
    <script>
        // --- GPA CALCULATOR LOGIC ---
        let totalPoints = 0;
        let totalCredits = 0;

        function addCourse() {
            const nameField = document.getElementById('courseName');
            const name = nameField.value || "Course";
            const points = parseFloat(document.getElementById('gradePoints').value);
            const credits = parseFloat(document.getElementById('credits').value);

            if (isNaN(credits) || credits <= 0) {
                alert("Please enter valid credit hours.");
                return;
            }

            totalPoints += (points * credits);
            totalCredits += credits;

            const gpa = (totalPoints / totalCredits).toFixed(2);
            
            document.getElementById('courseList').innerHTML += `<div class="course-row"><span>✔️ ${name} (${credits} Credits)</span><span>Pts: ${points}</span></div>`;
            document.getElementById('result').innerHTML = `Current Semester GPA: ${gpa}`;
            nameField.value = '';
        }

        function resetGPA() {
            totalPoints = 0;
            totalCredits = 0;
            document.getElementById('courseList').innerHTML = '';
            document.getElementById('result').innerHTML = '';
        }

        // --- TRUE 3D WEBGL CALCULATOR RENDERING (Three.js) ---
        const container = document.getElementById('webgl-container');

        // 1. Scene, Camera, Renderer setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 6;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 2. Enable Mouse Orbit Controls (Click and drag to rotate any direction)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 10;

        // 3. Lighting to create realistic metallic/plastic reflections
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1.2);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // 4. Create a 3D Realistic Calculator Body Box with Real Casio Texture Mapping
        // We build a custom canvas texture dynamically so it looks like a real Casio faceplate
        const canvasTex = document.createElement('canvas');
        canvasTex.width = 512;
        canvasTex.height = 1024;
        const ctx = canvasTex.getContext('2d');

        // Draw Calculator Faceplate Graphic Design
        ctx.fillStyle = '#1c1e24'; // Dark carbon chassis color
        ctx.fillRect(0, 0, 512, 1024);

        // Brand Label Header
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px Arial';
        ctx.fillText('CASIO', 40, 50);
        ctx.fillStyle = '#aaaaaa';
        ctx.font = '16px Arial';
        ctx.fillText('fx-82ES PLUS', 40, 80);
        ctx.fillText('NATURAL-V.P.A.M.', 40, 105);

        // LCD Screen Mockup Area
        ctx.fillStyle = '#8fa096';
        ctx.fillRect(40, 130, 432, 140);
        ctx.strokeStyle = '#222';
        ctx.lineWidth = 6;
        ctx.strokeRect(40, 130, 432, 140);

        // Screen text styling
        ctx.fillStyle = '#111';
        ctx.font = 'bold 22px monospace';
        ctx.fillText('Math DEG', 60, 165);
        ctx.font = 'bold 36px monospace';
        ctx.fillText('0.', 390, 240);

        // Keypad Grid Area Block Mockups
        const buttonRows = 7;
        const buttonCols = 4;
        const startX = 40;
        const startY = 320;
        const btnW = 95;
        const btnH = 65;
        const gapX = 17;
        const gapY = 15;

        for (let r = 0; r < buttonRows; r++) {
            for (let c = 0; c < buttonCols; c++) {
                let bx = startX + c * (btnW + gapX);
                let by = startY + r * (btnH + gapY);
                
                // Color coding special buttons like AC/Shift
                if ((r === 1 && c >= 2) || (r === 6 && c === 3)) {
                    ctx.fillStyle = '#27ae60'; // Green action keys
                } else {
                    ctx.fillStyle = '#2c3038'; // Standard dark keys
                }
                
                // Draw rounded buttons
                ctx.beginPath();
                ctx.roundRect(bx, by, btnW, btnH, 8);
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#111';
                ctx.stroke();
            }
        }

        const texture = new THREE.CanvasTexture(canvasTex);

        // 5. Create 3D Box Geometry (giving the calculator physical 3D thickness)
        const geometry = new THREE.BoxGeometry(2.4, 4.2, 0.35);
        
        // Apply textures and materials to the 6 sides of the 3D block
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0x14161a }), // Right side
            new THREE.MeshStandardMaterial({ color: 0x14161a }), // Left side
            new THREE.MeshStandardMaterial({ color: 0x14161a }), // Top side
            new THREE.MeshStandardMaterial({ color: 0x14161a }), // Bottom side
            new THREE.MeshStandardMaterial({ map: texture }),     // FRONT FACE (Real Casio Texture)
            new THREE.MeshStandardMaterial({ color: 0x111215 })  // Back face
        ];

        const calculatorMesh = new THREE.Mesh(geometry, materials);
        scene.add(calculatorMesh);

        // Initial default tilt angle so it looks nice right when the page loads
        calculatorMesh.rotation.x = 0.2;
        calculatorMesh.rotation.y = -0.4;

        // 6. Animation loop for smooth 3D tracking
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle browser window resizing
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
